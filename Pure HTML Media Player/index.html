<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Media Player - Adhyayan</title>
</head>
<body>
    <div class="video">
        <video src="1.mp4" height="500" controls loop></video>
    </div>
    <div class="video">
        <video src="2.mp4" height="500" width="300" controls loop></video>
    </div>
    <div class="video">
        <video src="3.mp4" height="400" controls loop></video>
    </div>
    <div class="video">
        <video src="4.mp4" height="500" controls loop></video>
    </div>
    <div class="video">
        <video src="5.mp4" height="450" controls width="700" loop></video>
    </div>
    <div class="video">
        <video src="6.mp4" height="600" controls loop></video>
    </div>
    <div class="audio">
        <audio src="1.mp3"controls></audio>
    </div>
    <div class="audio">
        <audio src="2.mp3"controls></audio>
    </div>
    <div class="audio">
        <audio src="3.mp3"controls></audio>
    </div>
    <div class="audio">
        <audio src="4.mp3"controls></audio>
    </div>
    <div class="audio">
        <audio src="5.mp3"controls></audio>
    </div>
    <div class="audio">
        <audio src="6.mp3"controls></audio>
    </div>
</body>
</html>
